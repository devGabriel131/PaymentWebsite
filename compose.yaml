services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: paymentwebsite
      POSTGRES_USER: paymentwebsite
      POSTGRES_PASSWORD: paymentwebsite
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paymentwebsite -d paymentwebsite"]
      interval: 2s
      timeout: 2s
      retries: 15

volumes:
  postgres_data:
